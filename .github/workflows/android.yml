name: Android CI

on:
  push:
    branches: [ "main" ]

jobs:
    build:
      runs-on: ubuntu-latest

      steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android & Gradle Project Files
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          # आवश्यक बेसिक फ़ाइलें बनाना
          if [ ! -f app/build.gradle ]; then
            mkdir -p app
            echo "plugins { id 'com.android.application' }" > app/build.gradle
            echo "android { namespace 'com.trading.locker' compileSdk 34 defaultConfig { applicationId 'com.trading.locker' minSdk 21 targetSdk 34 versionCode 1 versionName '1.0' } }" >> app/build.gradle
          fi
          if [ ! -f build.gradle ]; then
            echo "buildscript { repositories { google() mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:8.1.0' } }" > build.gradle
            echo "allprojects { repositories { google() mavenCentral() } }" >> build.gradle
          fi
          if [ ! -f settings.gradle ]; then
            echo "rootProject.name = 'Trading Locker'" > settings.gradle
            echo "include ':app'" >> settings.gradle
          fi

          # अगर gradlew नहीं है, तो Gradle wrapper जनरेट करें
          if [ ! -f gradlew ]; then
            gradle wrapper
          fi
          
          chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
